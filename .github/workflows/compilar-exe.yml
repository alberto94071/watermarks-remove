name: Compilar exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyinstaller opencv-python numpy imageio-ffmpeg tkinterdnd2

      - name: Compilar la interfaz grafica (QuitarMarca.exe)
        run: pyinstaller --onefile --windowed --name QuitarMarca --collect-all imageio_ffmpeg --collect-all tkinterdnd2 quitar_marca_gui.py

      - name: Compilar la version de linea de comandos (quitar_marca.exe)
        run: pyinstaller --onefile --console --name quitar_marca --collect-all imageio_ffmpeg quitar_marca.py

      - name: Probar que la version de consola arranca
        run: dist\quitar_marca.exe --help

      - name: Subir los exe
        uses: actions/upload-artifact@v4
        with:
          name: quitar_marca-windows
          path: |
            dist/QuitarMarca.exe
            dist/quitar_marca.exe
