name: Compilar exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyinstaller opencv-python numpy imageio-ffmpeg

      - name: Compilar con PyInstaller
        run: pyinstaller --onefile --console --name quitar_marca --collect-all imageio_ffmpeg quitar_marca.py

      - name: Probar que el exe arranca
        run: dist\quitar_marca.exe --help

      - name: Subir el exe
        uses: actions/upload-artifact@v4
        with:
          name: quitar_marca-windows
          path: dist/quitar_marca.exe
